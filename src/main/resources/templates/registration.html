<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Free Course Registration</title>

    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>DevOps Free Course</h1>

        <p class="subtitle">
            Register now and start your DevOps journey today.
        </p>

        <div th:if="${successMessage}" class="success">
            <span th:text="${successMessage}"></span>
        </div>

        <div th:if="${emailError}" class="error">
            <span th:text="${emailError}"></span>
        </div>

        <form th:action="@{/register}"
              th:object="${registration}"
              method="post">

            <label for="name">Full Name</label>
            <input type="text"
                   id="name"
                   th:field="*{name}"
                   placeholder="Enter your full name">

            <div class="field-error"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}">
            </div>

            <label for="email">Email Address</label>
            <input type="email"
                   id="email"
                   th:field="*{email}"
                   placeholder="Enter your email">

            <div class="field-error"
                 th:if="${#fields.hasErrors('email')}"
                 th:errors="*{email}">
            </div>

            <label for="phone">Phone Number</label>
            <input type="text"
                   id="phone"
                   th:field="*{phone}"
                   placeholder="10-digit phone number">

            <div class="field-error"
                 th:if="${#fields.hasErrors('phone')}"
                 th:errors="*{phone}">
            </div>

            <label for="course">Select Course</label>
            <select id="course" th:field="*{course}">
                <option value="">Select a course</option>
                <option value="DevOps Fundamentals">DevOps Fundamentals</option>
                <option value="AWS & DevOps">AWS & DevOps</option>
                <option value="Docker & Jenkins">Docker & Jenkins</option>
            </select>

            <div class="field-error"
                 th:if="${#fields.hasErrors('course')}"
                 th:errors="*{course}">
            </div>

            <button type="submit">
                Register Now
            </button>

        </form>

    </div>

</div>

</body>
</html>
